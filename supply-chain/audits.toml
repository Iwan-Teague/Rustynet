
# cargo-vet audits file

[[audits.block-buffer]]
who = "rustynet supply-chain lane b22 (GLM fleet, 2026-09-26)"
criteria = "safe-to-deploy"
delta = "0.10.4 -> 0.12.1"
notes = "Reviewed via cargo vet diff --mode=local. RustCrypto rewrite from generic-array 0.14 to hybrid-array 0.4 (edition 2024, MSRV 1.85). No build.rs. Unsafe reworked: ptr::read in Clone (SAFETY: type has no Drop), copy_nonoverlapping in set_data guarded by the buffer-kind invariant, slice::from_raw_parts in get_data/into_parts; every new unsafe block carries a SAFETY comment and the guard conditions were read in the diff. No network, file or process access. New deps: hybrid-array 0.4, optional zeroize 1.8; generic-array dropped."

