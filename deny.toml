[advisories]
version = 2

[bans]
# AQ-10 (R-SUP-1): duplicate versions are a supply-chain surface (more code,
# more advisories, harder audit). Deny by default; the `skip` list below names
# the transitive duplicates present at the time of flipping (RN-31 baseline) so
# a NEW duplicate fails CI. Drive this list down over time; do not grow it
# without a recorded reason.
multiple-versions = "deny"
wildcards = "allow"

# Transitive duplicates present when multiple-versions was set to deny
# (measured against Cargo.lock, AQ-10). Each is pulled by differing upstream
# version requirements we do not control directly.
skip = [
  { crate = "base64" },
  { crate = "bitflags" },
  # AQ-35 S6 (2026-09-25): ml-kem 0.3.2 pulls the digest 0.11 /
  # block-buffer 0.12 / crypto-common 0.2 / cpufeatures 0.3 line (through
  # sha3 0.11, and crypto-common 0.2 also directly through kem 0.3.0),
  # duplicating the digest 0.10 line already used by sha2/argon2/
  # chacha20poly1305. Both lines are required by their respective pinned
  # upstreams; revisit when the 0.10 consumers move to digest 0.11.
  { crate = "block-buffer" },
  { crate = "cpufeatures" },
  { crate = "crypto-common" },
  { crate = "digest" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  # 2026-11-01: tokio 1.51.6 (the RUSTSEC-2026-0386 fix) requires
  # tokio-macros ~2.7, which depends on syn 3; every other consumer is still on
  # syn 2. Compile-time proc-macro dependency only. Remove when the rest of
  # the tree moves to syn 3.
  { crate = "syn" },
  { crate = "nix" },
  { crate = "rand_core" },
  { crate = "redox_syscall" },
  { crate = "windows-sys" },
]

# Deprecated cryptographic algorithms (G2 — removal scheduled 2026-06-01)
[[bans.deny]]
name = "sha1"
wrappers = []

[[bans.deny]]
name = "md-5"
wrappers = []

# `md5` is a separate, standalone crates.io package (stainless-steel/md5,
# 115M+ downloads) — distinct from the RustCrypto `md-5` crate banned
# above. The G2c source-scan grep in scripts/ci/security_regression_gates.sh
# already rejects `use md5;` import statements, but without this deny
# entry a contributor could add `md5 = "0.8"` to a Cargo.toml without
# tripping `cargo deny check bans`. Deny both names for parity with the
# G2c grep coverage.
[[bans.deny]]
name = "md5"
wrappers = []

[[bans.deny]]
name = "des"
wrappers = []

[[bans.deny]]
name = "3des"
wrappers = []

[[bans.deny]]
name = "des3"
wrappers = []

# Additional deprecated cryptographic algorithms — RC4 has practical
# bias / recovery attacks (RC4 NOMORE, Bar-Mitzvah); RFC 7465
# prohibits it in TLS. MD4 has practical collisions (Wang 2005).
# MD2 has practical preimage attacks (RFC 6149 historic). The X3
# `scan_source_for_deprecated_crypto_imports` audit gates the
# Rust source-import side; this deny entry gates Cargo.toml.
[[bans.deny]]
name = "rc4"
wrappers = []

[[bans.deny]]
name = "md4"
wrappers = []

[[bans.deny]]
name = "md2"
wrappers = []

# RC2 — 64-bit-block cipher with practical related-key attacks
# (Knudsen 1997); RFC 8407 historic. Blowfish — 64-bit-block →
# sweet32-class birthday attacks after ~32 GiB ciphertext
# (CVE-2016-2183). Modern protocols use 128-bit-block ciphers.
[[bans.deny]]
name = "rc2"
wrappers = []

[[bans.deny]]
name = "blowfish"
wrappers = []

# AQ-10 (R-SUP-1) — C-crypto / non-rustls TLS path. The suite is rust-only
# with rare, justified exceptions; the crypto stack is rustls+ring/aws-lc, not
# OpenSSL. Ban the OpenSSL and native-tls families so a transitive dependency
# cannot silently pull a C TLS/crypto stack into the tree. None are present in
# Cargo.lock today (AQ-10 baseline) — these are guards against regression.
[[bans.deny]]
name = "openssl"
wrappers = []

[[bans.deny]]
name = "openssl-sys"
wrappers = []

[[bans.deny]]
name = "native-tls"
wrappers = []

# rustls-pemfile is superseded by PEM parsing in rustls-pki-types; banning it
# keeps one PEM path in the tree (rev-04 §2.5).
[[bans.deny]]
name = "rustls-pemfile"
wrappers = []

[licenses]
confidence-threshold = 0.8
allow = [
  # Rustynet's own (first-party) source-available license, applied to the
  # workspace crates via [workspace.package] license. Third-party dependencies
  # must still be one of the permissive licenses listed below. See ./LICENSE.
  "PolyForm-Noncommercial-1.0.0",
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-3-Clause",
  # Permissive (non-copyleft) licenses required by the rustls-based HTTPS stack
  # that the rustynet-mcp-ai-agent dev tool uses to reach its configured LLM provider:
  #   ISC                  -> ring, rustls, rustls-webpki, untrusted
  #   CDLA-Permissive-2.0  -> webpki-roots (Mozilla CA root bundle)
  "ISC",
  "CDLA-Permissive-2.0",
  # Blocked: MPL-2.0 is copyleft (RN-15).
  # "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
