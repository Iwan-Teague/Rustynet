[package]
name = "rustynet-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rustynet-dns-zone = { path = "../rustynet-dns-zone" }
rustynet-policy = { path = "../rustynet-policy" }
rustynet-crypto = { path = "../rustynet-crypto" }
subtle = "2"
sha2 = "0.10"
hkdf = "0.12"
# AQ-45 step 1 (charter/design/rustynet-control-db-atrest-v0.2.md §3/§8):
# pure-Rust XChaCha20-Poly1305; same 0.10 line rustynet-crypto already pins,
# so no new package enters Cargo.lock.
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"
hmac = "0.12"
rand.workspace = true
zeroize = "1"
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
rustynet-windows-native = { path = "../rustynet-windows-native" }

[dev-dependencies]
# Dev-only counting allocator for the perfprobe example (flagged; third_party internal).
rustynet-alloc-meter = { path = "../../third_party/rustynet-alloc-meter" }
tempfile = "3"

# AQ-08 step 1 (charter/governance/action-queue.md): panic-family clippy
# lints enforced here ahead of workspace-wide adoption. All other crates
# still use `[lints] workspace = true`; once [workspace.lints.clippy] is
# adopted at the workspace root, replace this table with it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
