[package]
name = "rustynet-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rustynet-dns-zone = { path = "../rustynet-dns-zone" }
rustynet-policy = { path = "../rustynet-policy" }
rustynet-crypto = { path = "../rustynet-crypto" }
subtle = "2"
sha2 = "0.10"
hkdf = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"
hmac = "0.12"
rand.workspace = true
zeroize = "1"
nix = { version = "0.29", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
rustynet-windows-native = { path = "../rustynet-windows-native" }

[dev-dependencies]
# Dev-only counting allocator for the perfprobe example (flagged; third_party internal).
rustynet-alloc-meter = { path = "../../third_party/rustynet-alloc-meter" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

# AQ-08 (rev-04 S2.1 / R-ENF-6): panic-path denial for trust-bearing crates.
# Explicit tables instead of `workspace = true` so the rest of the workspace
# can adopt the clippy denials crate-by-crate; keep in sync with the
# [workspace.lints] intent when the rollout completes.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

