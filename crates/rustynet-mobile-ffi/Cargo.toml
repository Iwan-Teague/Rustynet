[package]
name = "rustynet-mobile-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mobile FFI boundary (C ABI, panic wrapper, JNI shim skeleton). std only."

# MC1d (compile scope). The C ABI is consumed by the native shells; both
# cdylib (for the Android .so) and rlib (for host tests) are produced.
[lib]
crate-type = ["cdylib", "rlib"]

# Std only. No rustynet-tun, no backends, no rustynet-control, no tokio, no
# rusqlite, no rustls. scripts/mobile/check-mobile-deps.sh enforces this.
[dependencies]

# This crate is the ONE place in the mobile tree where `unsafe` is permitted
# (design DESIGN-mobile-security-architecture §5.2 U-2). The workspace
# `unsafe_code = "forbid"` (root Cargo.toml) cannot be overridden through
# `[lints] workspace = true`, so this crate does not inherit workspace lints.
# The same scoped downgrade is used by crates/rustynet-windows-native and
# crates/rustynetd. Every unsafe operation sits behind a narrowly scoped
# `#[allow(unsafe_code)]` and carries a `// SAFETY:` comment, and
# scripts/ci/mobile_unsafe_confinement_gate.sh pins the count.
[lints.rust]
unsafe_code = "deny"

# Panic-family denies, matching the other crates. Test code is exempt through
# the cfg_attr(test, allow(...)) block at the crate root.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
