[package]
name = "rustynet-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand.workspace = true
sha2 = "0.10"
subtle = "2"
ed25519-dalek = "2"
zeroize = "1"

# CRY-07: `Uid::effective()` for the key-custody ownership check. Unix-only, and
# already used for the same purpose by rustynet-control, the privileged helper,
# and the peer store, so this adds no new supply-chain surface. Declared inline
# with the same version and the single `user` feature rather than via
# workspace inheritance, matching rustynet-control -- the root manifest has no
# `nix` entry in [workspace.dependencies].
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
rustynet-windows-native = { path = "../rustynet-windows-native" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"

[lints]
workspace = true
