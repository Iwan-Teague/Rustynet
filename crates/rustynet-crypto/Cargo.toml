[package]
name = "rustynet-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
# AQ-35 S6 (charter/design/rustynet-d3-seams-plan-v0.4.md sections 4.5/4.7):
# ML-KEM-768 key encapsulation and the WireGuard PSK derived from its shared
# secret. Exact-pinned per plan section 6; the `zeroize` feature is section
# 4.7's requirement so decapsulation keys zeroize on drop.
ml-kem.workspace = true
# Already in Cargo.lock (0.12.4, used by rustynet-control); declared inline to
# match rustynet-control -- the root manifest has no `hkdf` entry in
# [workspace.dependencies].
hkdf = "0.12"
# rand_core supplies only the `CryptoRng` trait bound (no RNG construction in
# this crate; callers own randomness). Test code implements `TryRng` locally.
rand_core = "0.10"
rand.workspace = true
sha2 = "0.10"
subtle = "2"
ed25519-dalek = "2"
zeroize = "1"

# CRY-07: `Uid::effective()` for the key-custody ownership check. Unix-only, and
# already used for the same purpose by rustynet-control, the privileged helper,
# and the peer store, so this adds no new supply-chain surface. Declared inline
# with the same version and the single `user` feature rather than via
# workspace inheritance, matching rustynet-control -- the root manifest has no
# `nix` entry in [workspace.dependencies].
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
rustynet-windows-native = { path = "../rustynet-windows-native" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"

# AQ-08 step 1 (charter/governance/action-queue.md): panic-family clippy
# lints enforced here ahead of workspace-wide adoption. All other crates
# still use `[lints] workspace = true`; once [workspace.lints.clippy] is
# adopted at the workspace root, replace this table with it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
