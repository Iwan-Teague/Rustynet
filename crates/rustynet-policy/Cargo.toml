[package]
name = "rustynet-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]

# AQ-08 step 1 (charter/governance/action-queue.md): panic-family clippy
# lints enforced here ahead of workspace-wide adoption. All other crates
# still use `[lints] workspace = true`; once [workspace.lints.clippy] is
# adopted at the workspace root, replace this table with it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
