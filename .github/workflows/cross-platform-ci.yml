name: Cross Platform CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build+security
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap CI tools
        run: |
          RUSTYNET_CI_BOOTSTRAP_SYSTEM=0 ./scripts/ci/bootstrap_ci_tools.sh
      - name: Workspace validation
        # clippy is the single compile-correctness + lint pass: it is rustc
        # plus lint passes, so a separate `cargo check` here was a pure
        # duplicate full compile (no shared incremental cache across the
        # clippy wrapper).
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          # cargo-nextest (pinned via bootstrap_ci_tools, BLD-2) schedules the
          # workspace's ~100 test binaries against one concurrent pool instead
          # of cargo test's one-binary-at-a-time run. `cargo test --workspace
          # --all-targets --all-features` remains the authoritative gate
          # definition; --retries 0 (the default) is explicit so retries can
          # never silently mask a flaky test.
          cargo nextest run --workspace --all-targets --all-features --locked --retries 0
      - name: Repo hygiene gates
        # Two things nothing else enforces.
        #
        # AGENTS.md and CLAUDE.md are deliberately two real files (a symlink
        # materialises as a 10-byte text file on a Windows checkout without
        # core.symlinks, and this workflow has a Windows leg). They have never
        # diverged in 2552 commits — by discipline alone, with nothing mechanical
        # holding them together. The mirror guard script is that mechanism.
        #
        # The pre-commit hook refuses commits from a checkout behind its
        # upstream (and now also runs the same mirror guard). It lives in the
        # repo but `core.hooksPath` is per-clone config, so an uninstalled hook
        # is silent — verify at least that the hook is present and executable,
        # or it rots unnoticed.
        run: |
          bash scripts/ci/check_agents_claude_mirror.sh
          test -x scripts/git-hooks/pre-commit || {
            echo "scripts/git-hooks/pre-commit missing or not executable" >&2
            exit 1
          }
          echo "repo hygiene: doc pair identical, pre-commit hook present"
      - name: macOS bootstrap hardening gates (AQ-11)
        # The macOS bootstrap runs as root on a fresh host, so it is only as
        # hardened as the gate that holds it there: no sudo-policy edits, no
        # download of any kind in the macOS lane outside the named exemptions,
        # and stage < verify < extract with the verify reading the private
        # stage. A gate CI never runs protects nothing. macOS leg only: the
        # gate installs shellcheck through Homebrew when it is missing.
        run: |
          bash scripts/ci/bootstrap_macos_hardening_gates.sh
      - name: Shipped-binary feature gate
        # Everything above builds --all-features, so nothing here ever compiles
        # the CLI the way it actually ships. That gap is not cosmetic: features
        # are additive, so a `#[cfg(feature = "vm-lab")]` item is NAMEABLE under
        # --all-features and absent from a release build. Anything guarded that
        # way — QH-28 gates relay certificate minting on exactly this — is
        # therefore unenforced before merge and fails at tag time instead, in
        # release.yml, the only place that builds with default features.
        #
        # This compiles the binary as shipped. It is a compile check, not a text
        # assertion, so it cannot be walked around by moving a call behind a
        # helper or by renaming anything.
        run: |
          cargo check -p rustynet-cli --bin rustynet-cli --locked
      - name: Lab monitor standalone gates
        # rustynet-lab-monitor is EXCLUDED from the workspace (see root
        # Cargo.toml + crate README), so the workspace validation above never
        # touches it. Gate the excluded crate explicitly here. It is
        # macOS/Linux only, so it runs on this leg and the Debian leg, not
        # the Windows leg.
        run: |
          ./scripts/ci/lab_monitor_gates.sh
      - name: Fuzz-target compile gate
        # fuzz/ is a workspace of its own, so the workspace
        # validation above never compiles its targets — a fuzz target that
        # stopped building was invisible to CI. This compiles every [[bin]]
        # in fuzz/Cargo.toml under the pinned stable toolchain (the repo's
        # rust-toolchain.toml reaches fuzz/ because it is a subdirectory).
        # No cargo-fuzz/nightly: `cargo build --bins` typechecks and links
        # the libfuzzer-sys harnesses uninstrumented, which is exactly the
        # "targets still compile" assertion — instrumentation is what
        # cargo-fuzz adds at link time, not what the source needs. cargo
        # build fails on any target's compile error, so this gate cannot
        # pass over a broken target. libfuzzer-sys builds its bundled C++
        # runtime via cc, so a C++ compiler must exist (macOS runners ship
        # clang). macOS/Linux only — the Windows leg omits it (MSVC has no
        # libFuzzer runtime to link), mirroring lab_monitor_gates.sh.
        run: |
          ./scripts/ci/fuzz_build_gate.sh
      - name: Security gates
        # AQ-07: after the dependency-level audit/deny policy, run two
        # gate scripts whose checks are platform-neutral and measured
        # green on both CI platforms at the suite HEAD:
        # - secrets_hygiene_gates.sh: fail-closed probes that a secret
        #   cannot survive the redaction/logging paths unredacted.
        # - check_backend_boundary_leakage.sh: domain crates must not
        #   reference backend/WireGuard types.
        # secrets_hygiene runs on both legs: the Linux-only rustynetd
        # test compile that broke its Linux run was fixed, and the
        # Linux leg re-measured green.
        run: |
          cargo audit --deny warnings
          cargo deny check bans licenses sources advisories
          ./scripts/ci/secrets_hygiene_gates.sh
          ./scripts/ci/check_backend_boundary_leakage.sh
      - name: Security gate scripts (AQ-07)
        # The AQ-07 gate scripts that measured green on both CI
        # platforms and need nothing CI lacks: supply-chain integrity
        # (bans/deprecated-crypto/verify_strict drift), the role
        # transition audit, the LLM default-deny probes, and the
        # membership phase-10 report writer/verifier (clippy + focused
        # control/policy tests + report round-trip). Also green on both
        # platforms now that TWO Linux-only breaks are fixed: the
        # rustynetd test compile (anchor_secret_redaction — no
        # anchor/routing secret may survive logging or report paths
        # unredacted; role_auth_matrix — the role x capability command
        # matrix is fail-closed; nas_default_deny — default-deny probes
        # for the nas role), and, for security_regression (clippy
        # -D warnings, cargo-deny bans, and scans for deprecated crypto
        # and non-strict ed25519 verification), the self-op re-exec fix:
        # without it, its Linux run re-execs a binary path its own
        # cargo test stage relinked mid-run and fails. That fix must
        # land before this wiring does.
        # role_taxonomy_gates.sh is deliberately NOT wired yet: its
        # run_required_test used to flake under pipefail (grep -q could
        # report "filter matched zero tests" for a test that ran and
        # passed when cargo output exceeded the pipe buffer). The
        # pipefail sweep fixed those readers, but this gate has not
        # been re-measured green on both legs since; wire it after that
        # re-measure. These scripts assert repo source
        # invariants that audit/deny (which only see Cargo.lock +
        # manifests) cannot. Kept in-step rather than a separate job:
        # the added wall time is minutes against this leg's existing
        # length. rg backs the probes in the role/llm/nas gates; the
        # runner image is not guaranteed to ship it, and the AQ-11
        # shellcheck step sets the precedent for provisioning a missing
        # tool inside the step that needs it.
        run: |
          command -v rg >/dev/null 2>&1 || brew install ripgrep
          ./scripts/ci/supply_chain_integrity_gates.sh
          ./scripts/ci/role_transition_audit_gates.sh
          ./scripts/ci/llm_default_deny_gates.sh
          ./scripts/ci/membership_gates.sh
          ./scripts/ci/anchor_secret_redaction_gates.sh
          ./scripts/ci/security_regression_gates.sh
          ./scripts/ci/role_auth_matrix_gates.sh
          ./scripts/ci/nas_default_deny_gates.sh
          # vm-lab-only release-manifest seam must not leak into release
          # binaries (builds rustynet-cli release, default features, and
          # scans for seam markers; fails closed).
          ./scripts/ci/vm_lab_seam_release_hygiene_gate.sh

  debian13:
    name: Debian 13 build+security
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # MUST run before actions/checkout. The debian:trixie image has no git,
      # and when git is absent checkout silently falls back to downloading a
      # REST API tarball — leaving a workspace that is not a git repository at
      # all. Production code shells out to `git rev-parse HEAD` for the evidence
      # commit marker, so that surfaced as `fault_at_matrix_append_demotes`
      # failing with exit 128 and a message about MatrixAppend.
      #
      # Installing git in bootstrap_ci_tools.sh is NOT sufficient: that runs
      # after checkout, by which point the tarball fallback has already
      # happened and there is no .git to configure.
      - name: Install git before checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          git --version
          # The container runs as a different uid than owns the mounted
          # workspace, so git refuses it with exit 128 "detected dubious
          # ownership". Trust it BEFORE checkout, so the checkout produces a
          # real clone and every later `git rev-parse HEAD` works — production
          # code shells out to it for the evidence commit marker.
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history: the delegated-edit marker gate scans a git log
          # window, which needs real history, not a shallow clone.
          fetch-depth: 0
      - name: Bootstrap CI tools
        run: |
          ./scripts/ci/bootstrap_ci_tools.sh
      - name: Workspace validation
        # clippy is the single compile-correctness + lint pass (see the
        # macOS leg's note); no separate `cargo check` duplicate.
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          # nextest as the runner, cargo test as the authoritative definition —
          # see the macOS leg's comment (BLD-2).
          cargo nextest run --workspace --all-targets --all-features --locked --retries 0
      - name: Repo hygiene gates
        # Two things nothing else enforces.
        #
        # AGENTS.md and CLAUDE.md are deliberately two real files (a symlink
        # materialises as a 10-byte text file on a Windows checkout without
        # core.symlinks, and this workflow has a Windows leg). They have never
        # diverged in 2552 commits — by discipline alone, with nothing mechanical
        # holding them together. The mirror guard script is that mechanism.
        #
        # The pre-commit hook refuses commits from a checkout behind its
        # upstream (and now also runs the same mirror guard). It lives in the
        # repo but `core.hooksPath` is per-clone config, so an uninstalled hook
        # is silent — verify at least that the hook is present and executable,
        # or it rots unnoticed.
        run: |
          bash scripts/ci/check_agents_claude_mirror.sh
          test -x scripts/git-hooks/pre-commit || {
            echo "scripts/git-hooks/pre-commit missing or not executable" >&2
            exit 1
          }
          echo "repo hygiene: doc pair identical, pre-commit hook present"
      - name: Delegated-edit marker gate
        # QH-26 item 4: no commit carrying the delegated-edit checkpoint
        # marker pair may land outside the allowlist. The binary is
        # std-only and scans the checked-out history directly (hence the
        # fetch-depth: 0 above), so this step is near-free next to the
        # workspace build it piggybacks on.
        run: |
          ./scripts/ci/delegated_edit_marker_gate.sh
      - name: Platform-infer tripwire (QH-82)
        # Fails when any `.rs` under crates/ composes VmGuestPlatform::infer
        # with an unwrap_or/unwrap_or_else fallback to Linux, or carries a
        # bare unwrap_or(VmGuestPlatform::Linux). The migration to
        # Option-returning infer is only a gate if CI runs this.
        run: |
          ./scripts/ci/check_platform_infer_tripwire.sh
      - name: Shipped-binary feature gate
        # Everything above builds --all-features, so nothing here ever compiles
        # the CLI the way it actually ships. That gap is not cosmetic: features
        # are additive, so a `#[cfg(feature = "vm-lab")]` item is NAMEABLE under
        # --all-features and absent from a release build. Anything guarded that
        # way — QH-28 gates relay certificate minting on exactly this — is
        # therefore unenforced before merge and fails at tag time instead, in
        # release.yml, the only place that builds with default features.
        #
        # This compiles the binary as shipped. It is a compile check, not a text
        # assertion, so it cannot be walked around by moving a call behind a
        # helper or by renaming anything.
        run: |
          cargo check -p rustynet-cli --bin rustynet-cli --locked
      - name: Shipped-daemon feature gate (AQ-256)
        # The same gap for rustynetd, which release.yml also builds with
        # default features: everything above runs --all-features, so the
        # LAB-ONLY `lab-substrate` code (vxlan substrate transit, AQ-256) is
        # compiled into every CI test binary and its absence from the shipped
        # daemon is never exercised. This runs the daemon's suite with DEFAULT
        # features, which is where the feature-OFF witnesses live:
        # default_node_privileged_argv_golden (a default node's privileged
        # argv is byte-identical), the helper's refusal of the lab transit
        # rule, and the lab-substrate-capability probe being unknown. A cfg
        # gate dropped from any of that code fails here, not at tag time.
        # Linux leg only: the witnesses are Linux dataplane tests.
        run: |
          cargo nextest run -p rustynetd --all-targets --locked --retries 0
      - name: Lab monitor standalone gates
        # Excluded from the workspace; gate it explicitly on the Linux leg
        # too (macOS/Linux only crate). See scripts/ci/lab_monitor_gates.sh.
        run: |
          ./scripts/ci/lab_monitor_gates.sh
      - name: Fuzz-target compile gate
        # Same rationale as the macOS leg's step: fuzz/ is excluded from the
        # workspace, so this is its only CI compile check. bootstrap_ci_tools
        # installs build-essential on this leg, which provides the C++
        # compiler libfuzzer-sys' bundled runtime needs.
        run: |
          ./scripts/ci/fuzz_build_gate.sh
      - name: Security gates
        # AQ-07: two platform-neutral gate scripts measured green on
        # both CI platforms: the backend-boundary leakage gate (domain
        # crates must not reference backend/WireGuard types) and
        # secrets_hygiene_gates.sh (fail-closed probes that a secret
        # cannot survive the redaction/logging paths unredacted — green
        # on this leg again now that the Linux-only rustynetd test
        # compile behind its earlier red run is fixed).
        run: |
          cargo audit --deny warnings
          cargo deny check bans licenses sources advisories
          ./scripts/ci/check_backend_boundary_leakage.sh
          ./scripts/ci/secrets_hygiene_gates.sh
      - name: Security gate scripts (AQ-07)
        # Same green-on-both-platforms set as the macOS leg: supply-chain
        # integrity (bans/deprecated-crypto/verify_strict drift), the
        # role transition audit, the LLM default-deny probes, and the
        # membership phase-10 report writer/verifier (clippy + focused
        # control/policy tests + report round-trip). Also green on both
        # platforms now that TWO Linux-only breaks are fixed: the
        # rustynetd test compile (anchor_secret_redaction,
        # role_auth_matrix, nas_default_deny — same invariants as on
        # the macOS leg), and, for security_regression, the self-op
        # re-exec fix: without it, its Linux run re-execs a binary path
        # its own cargo test stage relinked mid-run and fails. That fix
        # must land before this wiring does.
        # role_taxonomy_gates.sh is deliberately NOT wired yet: its
        # run_required_test used to flake under pipefail (grep -q could
        # report "filter matched zero tests" for a test that ran and
        # passed when cargo output exceeded the pipe buffer). The
        # pipefail sweep fixed those readers, but this gate has not
        # been re-measured green on both legs since; wire it after that
        # re-measure. These scripts assert repo source
        # invariants that audit/deny cannot see. Kept in-step: the added
        # wall time is minutes against this leg's length.
        # bootstrap_ci_tools.sh installs no ripgrep, but the role/llm/nas
        # gates probe with rg; the AQ-11 shellcheck step sets the
        # precedent for provisioning a missing tool inside the step that
        # needs it. apt lists were refreshed by the git-install step
        # earlier in this job (same container instance).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ripgrep
          ./scripts/ci/supply_chain_integrity_gates.sh
          ./scripts/ci/role_transition_audit_gates.sh
          ./scripts/ci/llm_default_deny_gates.sh
          ./scripts/ci/membership_gates.sh
          ./scripts/ci/anchor_secret_redaction_gates.sh
          ./scripts/ci/security_regression_gates.sh
          ./scripts/ci/role_auth_matrix_gates.sh
          ./scripts/ci/nas_default_deny_gates.sh
          # RSA-0065: static integrity-pin gate for the Windows lab-image
          # provisioner — every download must carry a pinned SHA-256 (and
          # the floating vs_BuildTools.exe bootstrapper an Authenticode
          # 'Microsoft Corporation' publisher requirement) before execution.
          # Text-only checks + self-test battery (must reject the pre-fix
          # script shape); uses only grep/awk, no pwsh required on this leg.
          ./scripts/ci/windows_provisioner_download_integrity_gates.sh

  supply_chain:
    name: cargo-vet supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap CI tools
        run: |
          ./scripts/ci/bootstrap_ci_tools.sh
      - name: cargo vet (AQ-30)
        # supply-chain/config.toml + audits.toml + imports.lock gate every
        # dependency addition: a crate with no peer audit (mozilla / google /
        # bytecodealliance via imports.lock) and no local exemption fails the
        # build here. --locked = fully offline, uses the committed
        # imports.lock; a dependency bump that outruns an audit fails CI
        # until audited (cargo vet certify/inspect) or explicitly exempted.
        #
        # Exemption policy: any new exemption for a crypto- or parsing-adjacent
        # crate requires a documented human/AI code review of the crate source
        # (cargo vet inspect <crate>) recorded in the exempting commit —
        # adversarial-review-04 fix item 9.
        #
        # cargo-vet version pinned like cargo-audit/cargo-deny above (AQ-18
        # style); bump it together with [cargo-vet].version in
        # supply-chain/config.toml.
        run: |
          cargo install --locked cargo-vet --version 0.10.2
          cargo vet check --locked

  linux_e2e:
    name: Linux real WireGuard E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap CI tools
        run: |
          ./scripts/ci/bootstrap_ci_tools.sh
      - name: Run real dataplane E2E harness
        # sudo -E preserves env vars but NOT PATH/HOME: most sudo configs
        # (including this runner's) force PATH to a secure_path default and
        # HOME to root's home regardless of -E, so the cargo bootstrap_ci_tools
        # just installed on $GITHUB_PATH becomes invisible ("cargo: not
        # found") the moment this step elevates. Pass both through explicitly
        # instead of relying on -E's exact semantics.
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" ./scripts/e2e/real_wireguard_exitnode_e2e.sh

  windows:
    name: Windows build+security (rustynetd + windows-native)
    runs-on: windows-2022
    # Scope: this job exercises the Windows-portable crates that
    # carry the W1.x / W2.x / W4.x Windows verifier surface (the
    # SCM API bindings + DPAPI / SDDL / named-pipe / WinVerifyTrust
    # FFI in rustynet-windows-native, the `windows-…-check`
    # subcommands in rustynetd). The orchestrator crate
    # (rustynet-cli) deliberately ships unix-only modules
    # (ops_install_systemd, ops_phase9) at top level and therefore
    # cannot build on Windows; cross-target check from the macOS +
    # Debian jobs above already covers rustynet-cli's wire-format
    # compatibility with the Windows daemon.
    defaults:
      run:
        # Use Git Bash (pre-installed on windows-2022 runners) so
        # the cargo invocations match the macOS / Debian jobs above.
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Pin toolchain + install cargo-audit / cargo-deny / cargo-nextest
        run: |
          # The bash bootstrap wrapper invokes `cargo run -p
          # rustynet-cli --bin bootstrap_ci_tools`; rustynet-cli
          # does not build on Windows so we cannot use the wrapper
          # here. Pin the same versions inline, mirroring the
          # bootstrap binary's contract (AQ-18: a single toolchain
          # 1.88.0 == rust-toolchain.toml, cargo-audit=0.22.1,
          # cargo-deny=0.19.1, cargo-nextest=0.9.114). The former
          # separate 1.85.0 back-compat leg was removed — rustysuite
          # is private/owner-controlled with no external MSRV, and
          # the security tooling requires 1.88 anyway.
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo install cargo-audit --locked --version 0.22.1 --force
          cargo install cargo-deny --locked --version 0.19.1 --force
          cargo install cargo-nextest --locked --version 0.9.114 --force
      - name: Build + test Windows-portable crates
        run: |
          # Crate selection is intentional. rustynetd carries every
          # Windows-side validator (windows_paths,
          # windows_authenticode, windows_dns_failclosed,
          # windows_key_custody, windows_mesh_status,
          # windows_runtime_boundary, windows_service,
          # windows_service_hardening, windows_ipc, etc.).
          # rustynet-windows-native carries the FFI wrappers (DPAPI,
          # SDDL, named-pipe, WinVerifyTrust). The remaining crates
          # are the protocol-agnostic primitives the Windows daemon
          # links against; building them here exercises both
          # platform-conditional cfg paths AND any unix-only
          # regression that would slip past the Linux-side jobs.
          PKGS=(
            -p rustynetd
            -p rustynet-windows-native
            -p rustynet-crypto
            -p rustynet-policy
            -p rustynet-dns-zone
            -p rustynet-control
            -p rustynet-backend-api
            -p rustynet-backend-stub
            -p rustynet-relay
            -p rustynet-backend-wireguard
            -p rustynet-local-security
          )
          cargo fmt "${PKGS[@]}" -- --check
          # clippy doubles as the compile-correctness gate (rustc plus lint
          # passes); a separate `cargo check` of the same package set was a
          # pure duplicate compile.
          cargo clippy "${PKGS[@]}" --all-targets --all-features --locked -- -D warnings
          # --no-fail-fast: run EVERY test even after one fails, so a single
          # run surfaces the complete Windows failure set instead of stopping
          # at the first failure (Windows tests cannot be run locally on the
          # macOS lab host, so each masked failure would otherwise cost a full
          # ~12-min CI round-trip to discover). nextest is the runner (BLD-2);
          # `cargo test` remains the authoritative gate definition, and
          # --retries 0 keeps flaky-test retries structurally off.
          cargo nextest run "${PKGS[@]}" --all-targets --all-features --locked --no-fail-fast --retries 0
      - name: Security gates
        run: |
          # Check out the cargo-audit / cargo-deny advisory-db clones with LF.
          # Git-for-Windows defaults to autocrlf=true, which rewrites the
          # RustSec advisory `.md` files with CRLF on clone; the advisory
          # parser then fails ("failed to find toml block" parsing e.g.
          # abi_stable/RUSTSEC-2020-0105.md) before it can scan our deps. This
          # is a checkout-encoding issue in the advisory database, not a real
          # advisory/ban in the workspace. Pinning autocrlf=false makes the
          # freshly-cloned advisory-db parse identically to Linux/macOS.
          git config --global core.autocrlf false
          # cargo-audit + cargo-deny operate on Cargo.lock + the
          # workspace manifest, so they validate the whole
          # dependency surface (including rustynet-cli's deps) even
          # though we only built the Windows-portable subset above.
          cargo audit --deny warnings
          cargo deny check bans licenses sources advisories
