[package]
name = "rustynet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustynetd = { path = "../crates/rustynetd", features = ["fuzzing"] }
rustynet-control = { path = "../crates/rustynet-control" }
rustynet-relay = { path = "../crates/rustynet-relay" }
rustynet-dns-zone = { path = "../crates/rustynet-dns-zone" }
rustynet-policy = { path = "../crates/rustynet-policy" }
boringtun = { path = "../third_party/boringtun" }

[[bin]]
name = "ipc_parse_command"
path = "fuzz_targets/ipc_parse_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "membership_decode_state"
path = "fuzz_targets/membership_decode_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "membership_decode_signed_update"
path = "fuzz_targets/membership_decode_signed_update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_hello_parse"
path = "fuzz_targets/relay_hello_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_zone_bundle_parse"
path = "fuzz_targets/dns_zone_bundle_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "daemon_signed_bundle_parse"
path = "fuzz_targets/daemon_signed_bundle_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_selector_evaluate"
path = "fuzz_targets/policy_selector_evaluate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boringtun_decapsulate"
path = "fuzz_targets/boringtun_decapsulate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "daemon_custody_bundle_parse"
path = "fuzz_targets/daemon_custody_bundle_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "membership_custody_snapshot_parse"
path = "fuzz_targets/membership_custody_snapshot_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
